#Comment this code under this LoC for deploy only 

name: JAPA Deploy Kubeadm Docker Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'src/app/_unfinished-folder/**'
      - 'src/components/drafts/**'
      - 'src/app/(main)/_dashboard'
      - 'src/app/(main)/_mail'
      - 'src/app/(main)/_unauthorized'
      - 'src/test/**'
      - 'src/app/(external)/(admin)/**'
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  ECR_WEB_REPOSITORY: japa/consultant
  ECR_MCP_REPOSITORY: japa/mcp
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push Next.js Web image
      run: |
        docker build \
          --build-arg AUTH_SECRET=${{ secrets.AUTH_SECRET }} \
          --build-arg DATABASE_URL=${{ secrets.DATABASE_URL }} \
          --build-arg GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
          --build-arg GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
          -t $ECR_REGISTRY/$ECR_WEB_REPOSITORY:$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_WEB_REPOSITORY:latest .

    - name: Build, tag, and push MCP Server image
      run: |
        docker build -t $ECR_REGISTRY/$ECR_MCP_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_MCP_REPOSITORY:latest ./mcp-server
        docker push $ECR_REGISTRY/$ECR_MCP_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_MCP_REPOSITORY:latest

    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config
        chmod 600 ~/.kube/config
        sed -i "s|172.31.41.165|47.129.183.178|g" ~/.kube/config

    - name: Deploy to Kubeadm Cluster
      run: |
        # ==========================================
        # 1. REFRESH ECR SECRET (FIX FOR IMAGEPULLBACKOFF)
        # ==========================================
        kubectl create secret docker-registry ecr-secret \
          --docker-server=${{ env.ECR_REGISTRY }} \
          --docker-username=AWS \
          --docker-password=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }}) \
          --dry-run=client -o yaml | kubectl apply -f - --insecure-skip-tls-verify

        # ==========================================
        # 2. REPLACE PLACEHOLDERS
        # ==========================================
        sed -i "s|AWS_ACCOUNT_ID|${{ secrets.AWS_ACCOUNT_ID }}|g" k8s-manifest.yaml
        sed -i "s|AWS_REGION|${{ secrets.AWS_REGION }}|g" k8s-manifest.yaml
        sed -i "s|IMAGE_TAG|${{ env.IMAGE_TAG }}|g" k8s-manifest.yaml
        
        sed -i "s|AUTH_SECRET_PLACEHOLDER|${{ secrets.AUTH_SECRET }}|g" k8s-manifest.yaml
        sed -i "s|DATABASE_URL_PLACEHOLDER|${{ secrets.DATABASE_URL }}|g" k8s-manifest.yaml
        sed -i "s|GOOGLE_CLIENT_ID_PLACEHOLDER|${{ secrets.GOOGLE_CLIENT_ID }}|g" k8s-manifest.yaml
        sed -i "s|GOOGLE_CLIENT_SECRET_PLACEHOLDER|${{ secrets.GOOGLE_CLIENT_SECRET }}|g" k8s-manifest.yaml
        
        # ==========================================
        # 3. APPLY AND UPDATE
        # ==========================================
        kubectl apply -f k8s-manifest.yaml --validate=false --insecure-skip-tls-verify
        
        kubectl set image deployment/japa-consultant nextjs=$ECR_REGISTRY/$ECR_WEB_REPOSITORY:$IMAGE_TAG --insecure-skip-tls-verify
        kubectl set image deployment/japa-mcp mcp=$ECR_REGISTRY/$ECR_MCP_REPOSITORY:$IMAGE_TAG --insecure-skip-tls-verify
        
        echo "=== Checking pod status ==="
        sleep 5
        kubectl get pods --insecure-skip-tls-verify
        
        echo "=== Waiting for Next.js rollout ==="
        kubectl rollout status deployment/japa-consultant --timeout=10m --insecure-skip-tls-verify
        
        echo "=== Waiting for MCP Server rollout ==="
        kubectl rollout status deployment/japa-mcp --timeout=10m --insecure-skip-tls-verify