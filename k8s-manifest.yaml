apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-landing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      containers:
      - name: nextjs
        # The exact image tag is injected dynamically by GitHub Actions
        image: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/japa/consultant:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: japa-consultant
spec:
  type: NodePort
  selector:
    app: landing
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30080 # Exposes the app on port 30080 on all worker nodes