# ==========================================
# 1. NEXT.JS APP DEPLOYMENT & SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: japa-consultant
  labels:
    app: landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      imagePullSecrets:    
      - name: ecr-secret
      containers:
      - name: nextjs
        image: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/japa/consultant:IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        - name: ENV
          value: "production"
        - name: AUTH_TRUST_HOST
          value: "true"
        - name: AUTH_URL
          value: "AUTH_URL_PLACEHOLDER"
        - name: AUTH_SECRET
          value: "AUTH_SECRET_PLACEHOLDER"
        - name: DATABASE_URL
          value: "DATABASE_URL_PLACEHOLDER"
        - name: GOOGLE_CLIENT_ID
          value: "GOOGLE_CLIENT_ID_PLACEHOLDER"
        - name: GOOGLE_CLIENT_SECRET
          value: "GOOGLE_CLIENT_SECRET_PLACEHOLDER"
        - name: SMTP_HOST
          value: "SMTP_HOST_PLACEHOLDER"
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_USER
          value: "SMTP_USER_PLACEHOLDER"
        - name: SMTP_PASS
          value: "SMTP_PASS_PLACEHOLDER"
        - name: EMAIL_FROM
          value: "admin@japatek.space"
        - name: NEXT_PUBLIC_CAP_SITE_KEY
          value: "NEXT_PUBLIC_CAP_SITE_KEY_PLACEHOLDER"
        - name: CAP_BACKEND_URL
          value: "http://cap-service:8080"
        - name: TURNSTILE_SECRET_KEY
          value: "TURNSTILE_SECRET_KEY_PLACEHOLDER"
        - name: TURNSTILE_HOSTNAMES
          value: "japatek.space,www.japatek.space
---
apiVersion: v1
kind: Service
metadata:
  name: japa-consultant-service
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: landing

---
# ==========================================
# 2. MCP SERVER DEPLOYMENT & SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: japa-mcp
  labels:
    app: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: mcp
        image: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/japa/mcp:IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: NEXTJS_SERVICE_URL
          value: "http://japa-consultant-service:3000"
---
apiVersion: v1
kind: Service
metadata:
  name: japa-mcp-service
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: mcp

---
# ==========================================
# 3. VALKEY (REDIS) DEPLOYMENT & SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cap-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cap-valkey
  template:
    metadata:
      labels:
        app: cap-valkey
    spec:
      containers:
      - name: valkey
        image: valkey/valkey:9-alpine
        command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning", "--maxmemory-policy", "noeviction"]
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: cap-valkey-service
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: cap-valkey

---
# ==========================================
# 4. CAP CAPTCHA DEPLOYMENT & SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cap
  template:
    metadata:
      labels:
        app: cap
    spec:
      containers:
      - name: cap
        image: tiago2/cap:latest
        ports:
        - containerPort: 3000
        env:
        - name: ADMIN_KEY
          value: "superadmin12"
        - name: REDIS_URL
          value: "redis://cap-valkey-service:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: cap-service
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 3000
  selector:
    app: cap


# ==========================================
# 6. UNIFIED INGRESS CONTROLLER
# ==========================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: japa-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: japa-consultant-service
            port:
              number: 3000
      - path: /mcp
        pathType: Prefix
        backend:
          service:
            name: japa-mcp-service
            port:
              number: 8080
      - path: /api/cap
        pathType: Prefix
        backend:
          service:
            name: cap-service
            port:
              number: 8080