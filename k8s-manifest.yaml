apiVersion: apps/v1
kind: Deployment
metadata:
  name: japa-consultant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      containers:
      - name: nextjs
        # The exact image tag is injected dynamically by GitHub Actions
        image: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/japa/consultant:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1apiVersion: apps/v1
kind: Deployment
metadata:
  name: japa-consultant
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: nextjs
        image: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/japa/consultant:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: japa-consultant
  labels:
    app: landing
spec:
  type: NodePort
  selector:
    app: landing
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30080
kind: Service
metadata:
  name: japa-consultant
spec:
  type: NodePort
  selector:
    app: landing
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30080 # Exposes the app on port 30080 on all worker nodes