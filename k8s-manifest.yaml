apiVersion: apps/v1
kind: Deployment
metadata:
  name: japa-consultant
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      containers:
      - name: nextjs
        image: AWS_ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/japa/consultant:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        imagePullSecrets:
      - name: ecr-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: japa-consultant
  labels:
    app: landing
spec:
  type: NodePort
  selector:
    app: landing
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30080
